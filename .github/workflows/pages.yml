name: GATE EXPERIMENT (throwaway)

# Every push runs the tests. Only a push to main that passes them is deployed, and the deploy is then checked against the live site.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same branch makes an older, still-running test run pointless.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Run all tests
        run: npm run test:ci

  deploy:
    needs: test
    if: github.ref == 'refs/heads/gate-check-fail'
    runs-on: ubuntu-latest
    steps:
      - run: echo "GATE OPEN - tests passed, a real deploy would run here"
