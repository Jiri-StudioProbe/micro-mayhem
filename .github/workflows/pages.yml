name: Test and deploy

# Every push runs the tests. Only a push to main that passes them is deployed, and the deploy is then checked against the live site.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same branch makes an older, still-running test run pointless.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Run all tests
        run: npm run test:ci

  deploy:
    needs: test
    # Branches get tests only. GitHub Pages accepts deployments from main only, so a branch deploy would fail anyway.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys queue instead of cancelling each other.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the site (only what players need, stamped with this commit)
        run: node tools/stage-site.mjs _site "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify every published file is live and identical
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          tools/verify-live.sh "$URL" _site 30 10
          echo "### Live: ${URL} is commit \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
